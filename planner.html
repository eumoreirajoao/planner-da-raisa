<meta charset="utf-8">
<title>Planner da Raísa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a lilac desk with one sheet of planner paper; coloured tabs on top, pen tools above the sheet */
:root{
  --desk:#EEE6F3; --paper:#FFFCFD; --ink:#3D3350; --muted:#8A7E9E; --line:#E3D9EC;
  --lilac:#A98BDB; --lilac-soft:#E9DEF8; --rose:#EFA9BC; --rose-soft:#FBE3EA;
  --sage:#A9CC9F; --sky:#9EC6EA; --butter:#F1D88A; --peach:#F5C2A4;
  --on-tab:#3D3350; --shadow:0 1px 2px rgba(61,51,80,.06),0 12px 32px -12px rgba(61,51,80,.18);
  --pen-ink:#3D3350; --pen-lilac:#8E6CCF; --pen-rose:#D9708E; --pen-sage:#5E9A57; --pen-sky:#4F8FC9; --pen-butter:#E2B53C;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#17131E; --paper:#241E2E; --ink:#EDE6F6; --muted:#A496B9; --line:#3A3147;
  --lilac:#B79BEA; --lilac-soft:#3A2F50; --rose:#D98AA0; --rose-soft:#4A2E3A;
  --sage:#7FA676; --sky:#6E9CC4; --butter:#C7AA55; --peach:#C98E6E;
  --on-tab:#1C1724; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);
  --pen-ink:#EDE6F6; --pen-lilac:#C2A8F2; --pen-rose:#F09AB2; --pen-sage:#9BD08F; --pen-sky:#8EC0EE; --pen-butter:#F0CF6A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#17131E; --paper:#241E2E; --ink:#EDE6F6; --muted:#A496B9; --line:#3A3147;
  --lilac:#B79BEA; --lilac-soft:#3A2F50; --rose:#D98AA0; --rose-soft:#4A2E3A;
  --sage:#7FA676; --sky:#6E9CC4; --butter:#C7AA55; --peach:#C98E6E;
  --on-tab:#1C1724; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);
  --pen-ink:#EDE6F6; --pen-lilac:#C2A8F2; --pen-rose:#F09AB2; --pen-sage:#9BD08F; --pen-sky:#8EC0EE; --pen-butter:#F0CF6A;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

/* top: owner + status */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .hello{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand .name{font-family:var(--f-display);font-size:clamp(24px,3.4vw,34px);font-weight:500;line-height:1.1;display:flex;align-items:baseline;gap:.3em;flex-wrap:wrap}
.brand .name em{font-style:italic;color:var(--lilac)}
#ownerName{font-family:var(--f-display);font-style:italic;font-size:inherit;color:var(--lilac);background:none;border:0;border-bottom:1.5px dashed transparent;padding:0;width:8.5em;max-width:60vw}
#ownerName:hover,#ownerName:focus{border-bottom-color:var(--line);outline:none}
#ownerName::placeholder{color:var(--lilac);opacity:.55}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.seal{flex:none;width:58px;height:58px;border-radius:50%;background:var(--lilac-soft);box-shadow:inset 0 0 0 1.5px var(--lilac),inset 0 0 0 5px var(--lilac-soft),inset 0 0 0 6px color-mix(in srgb,var(--lilac) 50%,transparent);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--lilac);letter-spacing:-.02em}
.seal span:last-child{color:var(--rose);margin-left:-.08em;transform:translateY(.18em)}
.brand .full{font-family:var(--f-display);font-style:italic;font-size:13px;color:var(--muted);letter-spacing:.02em}
@media (max-width:480px){.seal{width:46px;height:46px;font-size:18px}}
.status{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--sage);display:inline-block}
.status.saving i{background:var(--butter)}
.status.warn i{background:var(--rose)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:4px;scrollbar-width:none;margin-bottom:-12px;position:relative;z-index:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:12px 12px 0 0;padding:9px 18px 20px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--on-tab);background:var(--c);opacity:.72;transform:translateY(6px);transition:transform .18s,opacity .18s;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;transform:translateY(0)}
.tab:hover{opacity:.95}

/* tool bar */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
.seg{display:flex;background:var(--lilac-soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(61,51,80,.15)}
.seg svg{width:17px;height:17px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.dots{display:flex;gap:6px;align-items:center}
.sz{width:30px;height:30px;border:0;border-radius:8px;background:none;display:grid;place-items:center}
.sz span{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--lilac-soft)}
.sep{width:1px;height:24px;background:var(--line)}
.tbtn{border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--muted)}
.tbtn:hover{background:var(--lilac-soft);color:var(--ink)}
.tbtn.danger[data-armed]{background:var(--rose);color:var(--on-tab)}
.finger{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-left:auto}
.penonly{display:contents}
.tools[data-tool="type"] .penonly{display:none}

/* sheet */
.sheet{position:relative;background:var(--paper);border-radius:4px 18px 18px 18px;box-shadow:var(--shadow);padding:clamp(18px,3vw,36px);min-height:70vh}
.sheet canvas{position:absolute;left:0;top:0;pointer-events:none;border-radius:inherit}
.sheet.pen canvas.base{pointer-events:auto;touch-action:pan-y;cursor:crosshair}
.sheet.pen.finger canvas.base{touch-action:none}
.sheet.pen canvas.eraser{cursor:cell}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1.5px solid var(--line)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lilac)}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,5vw,54px);line-height:1;margin:4px 0 6px;text-wrap:balance}
h1 em{font-style:italic;color:var(--rose)}
.sub{color:var(--muted);font-weight:600}
.nav{display:flex;align-items:center;gap:6px}
.nav button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;height:36px;min-width:36px;padding:0 12px;font-weight:800;font-size:13px;display:grid;place-items:center}
.nav button:hover{border-color:var(--lilac)}
.nav .today{background:var(--lilac-soft);border-color:transparent}

h2{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--lilac))}
.blk{display:flex;flex-direction:column;min-width:0}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,3vw,40px)}
@media (max-width:760px){.g2{grid-template-columns:1fr}}

.ln{display:flex;align-items:center;gap:10px;min-height:36px;border-bottom:1px dashed var(--line)}
.ln input[type=text],.ln input:not([type]){flex:1;min-width:0;border:0;background:none;padding:6px 0;font-weight:600;font-size:15px}
.ln input::placeholder{color:var(--muted);opacity:.45;font-weight:600}
.ln input:focus{outline:none}
.ln:focus-within{border-bottom-color:var(--lilac)}
.hr{font-variant-numeric:tabular-nums;font-size:12px;font-weight:800;color:var(--muted);width:42px;flex:none}
.ln.half .hr{opacity:.55}
.num{font-family:var(--f-display);font-style:italic;color:var(--rose);font-size:18px;width:18px;flex:none}

.chk{position:relative;width:20px;height:20px;flex:none;display:grid;place-items:center}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{width:18px;height:18px;border-radius:6px;border:1.8px solid var(--muted);opacity:.7;display:grid;place-items:center;transition:background .15s}
.chk input:checked+span{background:var(--lilac);border-color:var(--lilac);opacity:1}
.chk input:checked+span::after{content:"";width:5px;height:9px;border:solid var(--paper);border-width:0 2.2px 2.2px 0;transform:translate(0,-1px) rotate(45deg)}
.chk input:focus-visible+span{outline:2px solid var(--lilac);outline-offset:2px}
.ln:has(.chk input:checked) input:not([type=checkbox]){text-decoration:line-through;text-decoration-color:var(--rose);color:var(--muted)}

.icons{display:flex;gap:6px;flex-wrap:wrap}
.ico{border:0;background:none;padding:2px;border-radius:8px;width:38px;height:38px;display:grid;place-items:center}
.ico svg{width:30px;height:30px}
.ico .fill{fill:transparent;transition:fill .2s}
.ico .str{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico.drop[aria-pressed="true"] .fill{fill:var(--sky)}
.ico.drop[aria-pressed="true"] .str{stroke:var(--sky)}
.ico.mood[aria-pressed="true"] .fill{fill:var(--butter)}
.ico.mood[aria-pressed="true"] .str{stroke:var(--ink)}
.moodbox{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.moodbox small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gap{display:block;width:100%;height:16px;margin:-8px 0;position:relative;z-index:1;border:0;background:none;padding:0;cursor:pointer}
.gap::after{content:attr(data-label);position:absolute;left:44px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:var(--lilac);background:var(--paper);padding:1px 8px;border-radius:99px;box-shadow:0 0 0 1.5px var(--lilac);opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums}
.gap:hover::after,.gap:focus-visible::after{opacity:1}
.gap:focus-visible{outline:none}
.ln.half{display:none}
.ln.half.show{display:flex;background:linear-gradient(90deg,var(--lilac-soft),transparent 70%)}
.tip{font-size:12px;color:var(--muted);margin:8px 0 0}
.addln{align-self:flex-start;border:0;background:none;padding:8px 0 2px;font-weight:800;font-size:13px;color:var(--muted)}
.addln:hover{color:var(--ink)}
.rmln{flex:none;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:800;font-size:15px;padding:0;opacity:0}
.ln:hover .rmln,.ln:focus-within .rmln,.rmln:focus-visible,tr:hover .rmln{opacity:1}
@media (hover:none){.rmln{opacity:.6}}
.rmln:hover{background:var(--rose-soft);color:var(--ink)}
.hab td.rmc{width:30px}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px;border-bottom:1px dashed var(--line)}
.hlabel{width:96px;flex:none;font-weight:700;font-size:14px}
.hrow .ico{width:33px;height:33px}
.hrow .ico svg{width:26px;height:26px}
.hin{border:0;background:none;padding:6px 0}
.hin:focus{outline:none}
.hin::placeholder{color:var(--muted);opacity:.6}
.hrow .icons{gap:2px}
.ico.tick{width:34px;height:34px}
.ico.tick svg{width:26px;height:26px}
.ico.tick .ck{fill:none;stroke:transparent;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.tick[aria-pressed="true"] .fill{fill:var(--sage)}
.ico.tick[aria-pressed="true"] .str{stroke:var(--sage)}
.ico.tick[aria-pressed="true"] .ck{stroke:var(--paper)}
.hctl{display:flex;gap:2px;margin-left:auto;opacity:0}
.hrow:hover .hctl,.hrow:focus-within .hctl{opacity:1}
@media (hover:none){.hctl{opacity:.6}}
.hb{min-width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:800;font-size:15px;padding:0 6px}
.hb:hover:not(:disabled){background:var(--lilac-soft);color:var(--ink)}
.hb:disabled{opacity:.3}
.hb[data-armed]{background:var(--rose);color:var(--on-tab);font-size:12px}
.bell{flex:none;display:inline-flex;align-items:center;gap:3px;height:28px;min-width:28px;padding:0 6px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:800;font-size:12px;opacity:0;font-variant-numeric:tabular-nums;justify-content:center}
.ln:hover .bell,.ln:focus-within .bell,.bell:focus-visible,.bell.on{opacity:1}
@media (hover:none){.bell{opacity:.45}.bell.on{opacity:1}}
.bell:hover{background:var(--lilac-soft);color:var(--ink)}
.bell.on{color:var(--pen-lilac);background:var(--lilac-soft)}
.bell b{font-size:11px}
.pop .rem{display:flex;flex-direction:column;gap:10px;padding:2px 6px 8px;max-width:310px}
.rtext{font-weight:700;font-size:14px;padding:0 2px;word-break:break-word}
.rtime{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}
.rtime input,.rcustom input,.rcustom select{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--paper);font-weight:700;color:var(--ink)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchips.off,.rcustom.off{opacity:.4;pointer-events:none}
.rchip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px;font-weight:700;font-size:12.5px}
.rchip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:var(--on-tab)}
.rcustom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.rcustom input{width:58px}
.rnote{font-size:12px;color:var(--muted)}
.login{position:fixed;inset:0;z-index:60;background:var(--desk);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lcard{width:min(400px,100%);background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:8px}
.lcard h1{font-size:32px;margin:8px 0 0}
.lcard h1 em{font-style:italic;color:var(--lilac)}
.lcard p{color:var(--muted);font-weight:600;margin:0 0 8px}
.lcard label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lcard input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:16px;background:var(--paper)}
.lcard input:focus{outline:none;border-color:var(--lilac)}
.lcard .mini{padding:10px 16px;font-size:14px}
.lmsg{min-height:1.2em;font-size:13px}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px 10px 16px;font-weight:700;font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.water-count{font-size:12px;font-weight:700;color:var(--muted);margin-left:6px;align-self:center}

textarea.paper{width:100%;border:0;resize:vertical;background:transparent;font-weight:600;font-size:15px;line-height:36px;padding:0 2px;min-height:144px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--line) 35px 36px);background-attachment:local}
textarea.paper:focus{outline:none}
textarea.paper.tall{min-height:900px}

/* week */
.wk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:980px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.wk{grid-template-columns:1fr}}
.wd{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px 8px;min-width:0}
.wd.is-today{border-color:var(--lilac);background:linear-gradient(var(--lilac-soft),transparent 60px)}
.wd header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.wd header b{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.go{border:0;background:none;font-family:var(--f-display);font-size:26px;font-weight:500;line-height:1;padding:0 2px;border-radius:6px}
.go:hover{color:var(--lilac)}
.wd.focus{background:var(--rose-soft);border-color:transparent}
.wd .ln{min-height:32px}
.wd .ln input{font-size:14px}

/* month */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.5px solid var(--line);border-left:1.5px solid var(--line)}
.cal .dow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.cell{border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);min-height:96px;padding:4px 6px;display:flex;flex-direction:column;min-width:0}
.cell.out{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--lilac-soft) 6px 7px)}
.cell .go{font-size:17px;align-self:flex-start}
.cell.is-today .go{background:var(--lilac);color:var(--on-tab);border-radius:999px;padding:2px 8px}
.cell textarea{flex:1;border:0;background:none;resize:none;font-size:12.5px;font-weight:600;line-height:1.35;padding:2px 0;min-height:52px;width:100%}
.cell textarea:focus{outline:none}
@media (max-width:600px){.cell{min-height:70px;padding:3px}.cell textarea{font-size:11px}.cal .dow{padding:4px 3px;font-size:9px;letter-spacing:.04em}}
.below{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:26px}
@media (max-width:640px){.below{grid-template-columns:1fr}}

/* habits */
.hscroll{overflow-x:auto;margin:0 -4px;padding:0 4px 6px}
table.hab{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
.hab th{font-size:10.5px;font-weight:800;color:var(--muted);padding:4px 0;text-align:center}
.hab th.we{color:var(--rose)}
.hab th.name{text-align:left;width:170px}
.hab td{border-bottom:1px dashed var(--line);padding:3px 0;text-align:center}
.hab td.name input{width:100%;border:0;background:none;font-weight:700;font-size:14px;padding:6px 6px 6px 0}
.hab td.name input:focus{outline:none}
.hab td.name input::placeholder{color:var(--muted);opacity:.5}
.dot{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--line);background:none;padding:0;transition:background .12s,border-color .12s}
.dot[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.hab td.cnt{font-size:12px;font-weight:800;color:var(--muted);width:46px;text-align:right}

/* goals */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.goals{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.goals{grid-template-columns:1fr}}

const DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const DIAS_C = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const sameDay = (a,b) => iso(a) === iso(b);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- armazenamento: banco do artifact quando disponível, aparelho como cópia ---------- */
const cache = {}; const dirty = new Set(); const timers = {};
let db = null, assetsNS = null;
const ls = {
  get(k){ try { const v = localStorage.getItem('planner:'+k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k,v){ try { localStorage.setItem('planner:'+k, JSON.stringify(v)); } catch {} },
  pref(k,v){ try { if (v === undefined) return localStorage.getItem('pref:'+k); localStorage.setItem('pref:'+k, v); } catch { return null; } }
};
const norm = d => ({ f: (d && d.f) || {}, ink: (d && Array.isArray(d.ink)) ? d.ink : [] });
function getDoc(key){ if (!cache[key]) cache[key] = norm(ls.get(key)); return cache[key]; }

const statusEl = document.getElementById('status');
function setStatus(kind, text){
  statusEl.className = 'status ' + (kind||'');
  statusEl.querySelector('span').textContent = text || (db ? 'Salvo' : 'Salvo neste aparelho');
}
function touch(key){
  if (key.startsWith('day-')) queueReminders(key.slice(4));
  dirty.add(key); setStatus('saving','Salvando…');
  clearTimeout(timers[key]); timers[key] = setTimeout(() => flush(key), 700);
}
async function flush(key){
  clearTimeout(timers[key]); delete timers[key];
  const d = cache[key]; if (!d) return;
  ls.set(key, d);
  if (db) {
    if (JSON.stringify(d).length > 240000) { setStatus('warn','Página cheia de desenhos: salvo só neste aparelho'); dirty.delete(key); return; }
    try { await db.doc('planner/'+key).set(d); }
    catch (e) {
      if (e && (e.code === 'quota_exceeded')) { setStatus('warn','Espaço cheio: salvo só neste aparelho'); return; }
      if (e && e.code === 'unavailable') { setTimeout(() => touch(key), 1500 + Math.random()*1500); return; }
      db = null;
    }
  }
  if (!timers[key]) dirty.delete(key);
  if (!Object.keys(timers).length) setStatus();
}
function flushAll(){ Object.keys(timers).forEach(flush); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
window.addEventListener('pagehide', flushAll);

async function pull(key){
  if (!db) return;
  try {
    const s = await db.doc('planner/'+key).get();
    if (s.exists && !dirty.has(key)) {
      const remote = norm(s.data());
      if (JSON.stringify(remote) === JSON.stringify(cache[key])) return;
      cache[key] = remote; ls.set(key, remote);
      if (key.startsWith('day-')) queueReminders(key.slice(4));
      if (key === 'config') applyConfig();
      else if (key === 'notes-tree') {
        if (S.view !== 'notas') return;
        renderTree();
        if (!document.getElementById('blocks') && S.noteId && byId(S.noteId)) { renderEditor(); pull(pageKey()); }
        else updateCrumbs();
      }
      else if (key === pageKey()) render();
    }
  } catch {}
}

/* listas que crescem: prioridades e tarefas do dia, hábitos do mês */
const LISTS = {
  p:   { base: 3, first: 1, count: 'pN', fields: i => [`p${i}`, `p${i}c`] },
  t:   { base: 6, first: 1, count: 'tN', fields: i => [`t${i}`, `t${i}c`, `t${i}time`, `r-t${i}`] },
  hab: { base: 8, first: 0, count: 'hN', fields: i => [`hn${i}`, ...Array.from({ length: 31 }, (_, d) => `x${i}-${d+1}`)] }
};
const listN = (key, f) => Math.max(LISTS[key].base, +f[LISTS[key].count] || 0);
function addRow(key){
  const c = LISTS[key], f = getDoc(pageKey()).f, n = listN(key, f);
  f[c.count] = n + 1; touch(pageKey()); render();
  document.getElementById('f-' + c.fields(c.first + n)[0])?.focus();
}
function removeRow(key, idx){
  const c = LISTS[key], f = getDoc(pageKey()).f, last = c.first + listN(key, f) - 1;
  for (let j = idx; j < last; j++) {
    const to = c.fields(j), from = c.fields(j + 1);
    to.forEach((k, x) => { if (f[from[x]] === undefined) delete f[k]; else f[k] = f[from[x]]; });
  }
  c.fields(last).forEach(k => delete f[k]);
  f[c.count] = listN(key, f) - 1; touch(pageKey()); render();
}
/* lembretes: cada compromisso ou tarefa guarda uma lista de "minutos antes" em f['r-campo'] */
const BELL = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>';
const CLOCK = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const OFFSETS = [[0,'Na hora'],[5,'5 min antes'],[10,'10 min antes'],[15,'15 min antes'],[30,'30 min antes'],[60,'1 hora antes'],[120,'2 horas antes'],[1440,'1 dia antes'],[2880,'2 dias antes'],[10080,'1 semana antes']];
function offsetLabel(m){
  const k = OFFSETS.find(o => o[0] === m); if (k) return k[1];
  if (m % 1440 === 0) return `${m/1440} ${m === 1440 ? 'dia' : 'dias'} antes`;
  if (m % 60 === 0) return `${m/60} ${m === 60 ? 'hora' : 'horas'} antes`;
  return `${m} min antes`;
}
const remsOf = (f, field) => Array.isArray(f['r-' + field]) ? f['r-' + field] : [];
function bellBtn(field, time, f){
  const n = remsOf(f, field).length;
  return `<button class="bell${n ? ' on' : ''}" data-rem="${field}" data-time="${time}" aria-label="Lembretes das ${time}" title="Lembretes">${BELL}${n ? `<b>${n}</b>` : ''}</button>`;
}
function taskBtn(i, f){
  const t = f[`t${i}time`] || '', n = remsOf(f, 't' + i).length;
  return `<button class="bell tclock${t ? ' on' : ''}" data-rem="t${i}" aria-label="Horário e lembretes da tarefa" title="Horário e lembretes">${t ? `<span>${t}</span>` : CLOCK}${t && n ? `${BELL}<b>${n}</b>` : ''}</button>`;
}
function remButtonHTML(field){
  const f = getDoc(pageKey()).f;
  if (field[0] === 't') return taskBtn(+field.slice(1), f);
  const h = +field.slice(1).replace('m', '');
  return bellBtn(field, `${pad(h)}:${field.endsWith('m') ? '30' : '00'}`, f);
}
const rmBtn = (key, i) => `<button class="rmln" data-rm="${key}" data-i="${i}" aria-label="Remover linha" title="Remover linha">×</button>`;
const tickDot = (id, k, name) => `<button class="ico tick" data-f="dh-${id}-${k}" aria-label="${esc(name || 'Hábito')} ${k}"><svg viewBox="0 0 24 24"><circle class="fill str" cx="12" cy="12" r="8.5"/><path class="ck" d="M8.5 12.3l2.4 2.4 4.6-5"/></svg></button>`;
const dayHabits = () => { const c = getDoc('config').f; if (!Array.isArray(c.dh)) c.dh = []; return c.dh; };

function viewDia(){
  const d = S.date, today = sameDay(d, new Date()), f = getDoc(pageKey()).f;

  const habits = dayHabits().map(h => `<div class="hrow" data-dh="${h.id}">

}
function mountPage(){
  pageEl.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addRow(b.dataset.add)));
  pageEl.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => removeRow(b.dataset.rm, +b.dataset.i)));
  pageEl.querySelectorAll('[data-half]').forEach(g => g.addEventListener('click', () => {
    const row = document.getElementById('half-' + g.dataset.half);
    g.hidden = true; row.classList.add('show'); row.querySelector('input').focus();
  }));
  pageEl.querySelectorAll('.ln.half input').forEach(inp => inp.addEventListener('blur', () => {
    if (inp.value.trim()) return;
    const row = inp.closest('.half'); row.classList.remove('show');
    const g = row.previousElementSibling; if (g && g.classList.contains('gap')) g.hidden = false;
  }));
  // hábitos do dia: nomes e quantidade valem para todos os dias; as marcações são de cada dia
  const habitOf = el => { const id = el.closest('[data-dh]')?.dataset.dh; return dayHabits().find(h => h.id === id); };
  pageEl.querySelectorAll('[data-dhname]').forEach(inp => inp.addEventListener('input', () => { const h = habitOf(inp); if (h) { h.name = inp.value; touch('config'); } }));
  pageEl.querySelectorAll('[data-dhn]').forEach(b => b.addEventListener('click', () => {
    const h = habitOf(b); if (!h) return;
    h.n = Math.min(12, Math.max(1, (h.n || 1) + +b.dataset.dhn)); touch('config'); render();
  }));
  pageEl.querySelectorAll('[data-dhrm]').forEach(b => b.addEventListener('click', () => {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Remover?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; } }, 3000); return; }
    const h = habitOf(b); if (!h) return;
    const c = getDoc('config').f; c.dh = dayHabits().filter(x => x !== h); touch('config'); render();
  }));
  pageEl.querySelector('[data-dhadd]')?.addEventListener('click', () => {
    const h = { id: nid(), name: '', n: 1 }; dayHabits().push(h); touch('config'); render();
    document.getElementById('dhn-' + h.id)?.focus();
  });
}
function viewSemana(){

  const range = m.getMonth() === end.getMonth()
    ? `${m.getDate()} – ${end.getDate()} de ${MESES[m.getMonth()]}`
    : `${m.getDate()} de ${MESES[m.getMonth()].slice(0,3)} – ${end.getDate()} de ${MESES[end.getMonth()].slice(0,3)}`;
  let cards = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(m,i);
    cards += `<article class="wd${sameDay(d,new Date())?' is-today':''}"><header><b>${DIAS[d.getDay()].replace('-feira','')}</b><button class="go" data-go="${iso(d)}" title="Abrir o dia">${d.getDate()}</button></header>${[1,2,3,4,5].map(j => checkLine(`d${i}-${j}`)).join('')}</article>`;
  }

  return `

  <div class="wk">${cards}</div>`;
}
function viewMes(){
  const y = S.date.getFullYear(), mo = S.date.getMonth();
  const first = new Date(y,mo,1), days = new Date(y,mo+1,0).getDate(), lead = (first.getDay()+6)%7;
  let cells = DIAS_C.map(n => `<div class="dow">${n}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += `<div class="cell out"></div>`;
  for (let n = 1; n <= days; n++) {
    const d = new Date(y,mo,n);
    cells += `<div class="cell${sameDay(d,new Date())?' is-today':''}"><button class="go" data-go="${iso(d)}" title="Abrir o dia">${n}</button><textarea id="f-d${n}" data-f="d${n}" aria-label="Dia ${n}"></textarea></div>`;
  }
  const tail = (7 - (lead+days)%7) % 7;
  for (let i = 0; i < tail; i++) cells += `<div class="cell out"></div>`;
  return `
  <header class="ph"><div><div class="eyebrow">${y}</div><h1>${cap(MESES[mo])}</h1><div class="sub">${days} dias para fazer acontecer</div></div>${nav('Este mês')}</header>

}

const CE = (() => { try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only' ? 'plaintext-only' : 'true'; } catch { return 'true'; } })();
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const normS = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const FCOL = ['var(--lilac)','var(--rose)','var(--sky)','var(--sage)','var(--butter)'];
const IC = {
  chev: '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  folder: c => `<svg class="fi" viewBox="0 0 24 24" style="--fc:${c}"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>`,
  note: '<svg class="ni" viewBox="0 0 24 24"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>'
};
let openSet = new Set((() => { try { return JSON.parse(ls.pref('open') || '[]'); } catch { return []; } })());
const saveOpen = () => ls.pref('open', JSON.stringify([...openSet]));
let renaming = null, slash = null;

function items(){ const d = getDoc('notes-tree'); if (!Array.isArray(d.f.items)) d.f.items = []; return d.f.items; }
const byId = id => items().find(i => i.id === id);
const saveTree = () => touch('notes-tree');
const labelOf = it => it.title || (it.type === 'folder' ? 'Nova pasta' : 'Sem título');
function children(pid){
  return items().filter(i => (i.parent || null) === (pid || null))
    .sort((a,b) => (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) || labelOf(a).localeCompare(labelOf(b), 'pt-BR', { sensitivity: 'base', numeric: true }));
}
function descendants(id){ const out = []; const walk = p => children(p).forEach(c => { out.push(c); if (c.type === 'folder') walk(c.id); }); walk(id); return out; }
function ancestors(id){ const out = []; let it = byId(id); while (it && it.parent) { it = byId(it.parent); if (it) out.unshift(it); } return out; }
function folderList(pid, d, excl){ return children(pid).filter(c => c.type === 'folder' && !excl.has(c.id)).flatMap(f => [{ f, d }, ...folderList(f.id, d+1, excl)]); }
function removeDoc(key){
  clearTimeout(timers[key]); delete timers[key]; dirty.delete(key); delete cache[key];
  try { localStorage.removeItem('planner:'+key); } catch {}
  if (db) db.doc('planner/'+key).delete().catch(() => {});
}

function mountNotes(){
  const side = pageEl.querySelector('.side');
  side.addEventListener('click', onTreeClick);
  document.getElementById('nsearch').addEventListener('input', renderTree);
  renderTree(); renderEditor();
}
function rowHTML(it, depth, extra=''){
  const isF = it.type === 'folder', open = openSet.has(it.id), nest = isF || children(it.id).length > 0;
  const count = isF ? descendants(it.id).filter(x => x.type === 'note').length : 0;
  const name = renaming === it.id
    ? `<input class="rn" id="rn" value="${esc(it.title)}" placeholder="Nome da pasta" aria-label="Nome da pasta" autocomplete="off">`
    : `<button class="nm" data-act="${isF ? 'toggle' : 'open'}">${isF ? IC.folder(FCOL[depth % FCOL.length]) : IC.note}<span>${esc(labelOf(it))}</span>${extra || (count ? `<small>${count}</small>` : '')}</button>`;
  return `<div class="row${it.id === S.noteId ? ' on' : ''}" data-id="${it.id}" style="--d:${depth}" role="treeitem"${nest ? ` aria-expanded="${open}"` : ''}>
    ${nest ? `<button class="tw${open ? ' open' : ''}" data-act="toggle" aria-label="${open ? 'Fechar' : 'Abrir'}">${IC.chev}</button>` : '<span class="tw"></span>'}
    ${name}
    ${isF ? '<button class="rb" data-act="add" aria-label="Nova nota nesta pasta" title="Nova nota nesta pasta">+</button>' : ''}
    <button class="rb" data-act="menu" aria-label="Opções" title="Opções">⋯</button>
  </div>`;
}
function treeHTML(pid, depth){
  return children(pid).map(it => {
    let kids = '';
    if (openSet.has(it.id)) kids = treeHTML(it.id, depth+1) || (it.type === 'folder' ? `<div class="erow" style="--d:${depth+1}">Pasta vazia</div>` : '');
    return rowHTML(it, depth) + kids;
  }).join('');
}
function renderTree(){
  const tree = document.getElementById('tree'); if (!tree) return;
  const q = normS(document.getElementById('nsearch').value.trim());
  if (q) {
    const hits = items().filter(i => i.type === 'note' && normS(labelOf(i)).includes(q));
    tree.innerHTML = hits.length
      ? hits.map(it => { const a = ancestors(it.id); return rowHTML(it, 0, a.length ? `<small>${esc(labelOf(a[a.length-1]))}</small>` : ''); }).join('')
      : '<p class="tempty">Nenhuma nota com esse nome.</p>';
    return;
  }
  tree.innerHTML = treeHTML(null, 0) || '<p class="tempty">Crie uma pasta para cada assunto, como a clínica, e subpastas dentro dela, como cada paciente.</p>';
  const rn = document.getElementById('rn');
  if (rn) {
    const id = renaming;
    const commit = () => { if (renaming !== id) return; const it = byId(id); renaming = null; if (it) { it.title = rn.value.trim(); saveTree(); } renderTree(); updateCrumbs(); };
    rn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); commit(); } });
    rn.addEventListener('blur', commit);
    rn.focus(); rn.select();
  }
}
function onTreeClick(e){
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.row')?.dataset.id, act = b.dataset.act;
  if (act === 'newnote') createNote(null);
  else if (act === 'newfolder') createFolder(null);
  else if (act === 'toggle') { openSet.has(id) ? openSet.delete(id) : openSet.add(id); saveOpen(); renderTree(); }
  else if (act === 'open') openNote(id);
  else if (act === 'add') createNote(id);
  else if (act === 'menu') { if (!pop.hidden && pop.dataset.id === id) closePop(); else openMenu(b, id); }
}
function createFolder(parent){
  const it = { id: nid(), type: 'folder', parent: parent || null, title: '' };
  items().push(it); if (parent) { openSet.add(parent); saveOpen(); }
  renaming = it.id; saveTree(); renderTree();
}
function createNote(parent){
  const it = { id: nid(), type: 'note', parent: parent || null, title: '' };
  items().push(it); saveTree(); openNote(it.id, true);
}
function openNote(id, focusTitle){
  flushAll(); closePop();
  S.noteId = id; ls.pref('note', id);
  ancestors(id).forEach(f => openSet.add(f.id)); saveOpen();
  render(); pull(pageKey());
  const t = document.getElementById('ntitle');
  if (focusTitle && t) { t.focus(); const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  if (window.innerWidth < 760) document.getElementById('ed')?.scrollIntoView({ block: 'start' });
}
function deleteItem(id){
  const it = byId(id); if (!it) return;
  const all = [it, ...descendants(id)];
  getDoc('notes-tree').f.items = items().filter(i => !all.includes(i));
  all.filter(x => x.type === 'note').forEach(n => removeDoc('note-' + n.id));
  if (all.some(x => x.id === S.noteId)) { S.noteId = null; ls.pref('note', ''); }
  saveTree(); render();
}

/* menu flutuante: opções da pasta/nota e o menu do "/" */
const pop = document.createElement('div');
pop.className = 'pop'; pop.hidden = true; document.body.appendChild(pop);
function placePop(rect){
  pop.hidden = false; pop.style.maxHeight = '';
  const below = window.innerHeight - rect.bottom - 18;
  if (below >= 200 && pop.offsetHeight > below) pop.style.maxHeight = below + 'px';
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(rect.left, window.innerWidth - w - 12), top = rect.bottom + 6;
  if (top + h > window.innerHeight - 12) top = Math.max(12, rect.top - h - 6);
  pop.style.left = Math.max(12, left) + 'px'; pop.style.top = top + 'px';
}
function closePop(){ pop.hidden = true; pop.innerHTML = ''; delete pop.dataset.kind; delete pop.dataset.id; slash = null; }
document.addEventListener('pointerdown', e => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-act="menu"],[data-rem]')) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pop.dataset.kind === 'menu') closePop(); });
let lastW = window.innerWidth;   // o teclado do celular muda só a altura: não fecha o menu
window.addEventListener('resize', () => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; if (!pop.hidden) closePop(); } });

function openMenu(btn, id){
  const it = byId(id); if (!it) return;
  const acts = it.type === 'folder'
    ? [['addnote','Nova nota aqui'],['addfolder','Nova subpasta'],['rename','Renomear'],['move','Mover para…'],['del','Excluir pasta']]
    : [['addnote','Nova subpágina'],['rename','Renomear'],['move','Mover para…'],['del','Excluir nota']];
  pop.dataset.kind = 'menu'; pop.dataset.id = id;
  pop.innerHTML = acts.map(([a,l]) => `<button class="mi${a === 'del' ? ' danger' : ''}" data-m="${a}">${l}</button>`).join('');
  placePop(btn.getBoundingClientRect());
}
pop.addEventListener('click', e => {
  if (pop.dataset.kind !== 'menu') return;
  const id = pop.dataset.id, it = byId(id); if (!it) return closePop();
  const to = e.target.closest('[data-to]');
  if (to) {
    it.parent = to.dataset.to || null;
    if (it.parent) { openSet.add(it.parent); saveOpen(); }
    saveTree(); closePop(); renderTree(); updateCrumbs(); return;
  }
  const m = e.target.closest('[data-m]'); if (!m) return;
  const a = m.dataset.m;
  if (a === 'addnote') { closePop(); createNote(id); }
  else if (a === 'addfolder') { closePop(); createFolder(id); }
  else if (a === 'rename') { closePop(); if (it.type === 'folder') { renaming = id; renderTree(); } else openNote(id, true); }
  else if (a === 'move') {
    const excl = new Set([id, ...descendants(id).map(x => x.id)]);
    pop.innerHTML = `<div class="cap">Mover para</div><button class="mi" data-to="">${IC.note.replace('ni','ni home')}Caderno (início)</button>` +
      folderList(null, 0, excl).map(({ f, d }) => `<button class="mi" data-to="${f.id}" style="padding-left:${10 + d*16}px">${IC.folder(FCOL[d % FCOL.length])}${esc(labelOf(f))}</button>`).join('');
  }
  else if (a === 'del') {
    if (!m.dataset.armed) {
      m.dataset.armed = '1';
      const n = descendants(id).length;
      m.textContent = it.type === 'folder' && n ? `Excluir pasta e ${n} ${n === 1 ? 'item' : 'itens'} dentro?` : 'Toque de novo para excluir';
      return;
    }
    closePop(); deleteItem(id);
  }
});

      const chips = ['<span>Caderno</span>', ...chain.map(c => c.type === 'note' && c.id !== S.noteId

      return `${open()}<nav class="crumbline" aria-label="Caminho da nota">${chips.join('<i>/</i>')}</nav>${bx}</div>`;
    }
    case 'page': {
      const p = byId(b.ref);
      return `${open()}<button class="pagelink" data-do="open"${p ? '' : ' disabled'}>${GI.page}<span>${esc(p ? labelOf(p) : 'Página excluída')}</span></button>${bx}</div>`;
    }

    case 'code': return `${open()}<span class="clbl">Código</span>${txHTML(b)}</div>`;
    case 'math': return `${open(mathEditing.has(b.id) || !b.x ? 'editing' : '')}<div class="mview" data-do="medit" title="Editar fórmula"></div>${txHTML(b)}<div class="mhint">Escreva em TeX, por exemplo <code>\\frac{a}{b}</code>. Enter para terminar.</div></div>`;
    case 'bookmark': {

      let host = ''; try { host = new URL(b.url).hostname.replace(/^www\./, ''); } catch {}

      return `${open()}<div class="tscroll"><table class="ntbl">${body}</table></div><div class="tbar"><button class="mini" data-do="addrow">+ Linha</button><button class="mini" data-do="addcol">+ Coluna</button>${rows.length > 2 ? '<button class="mini ghost" data-do="delrow">− Linha</button>' : ''}${rows[0].length > 1 ? '<button class="mini ghost" data-do="delcol">− Coluna</button>' : ''}</div>${bx}</div>`;

    case 'button': {

function mediaHTML(b, bx){

  const broken = '<span class="broken-msg">Arquivo indisponível neste acesso</span>';
  if (b.t === 'image' || (b.t === 'file' && /^image\//.test(b.ct))) return `${head}<figure class="media"><img ${url} alt="${esc(b.cap || b.n || 'Imagem')}" loading="lazy">${broken}</figure>${ce('cap', b.cap, 'Escreva uma legenda', 'cap')}${bx}</div>`;
  if (b.t === 'video' || (b.t === 'file' && /^video\//.test(b.ct))) return `${head}<figure class="media"><video ${url} controls playsinline preload="metadata"></video>${broken}</figure>${ce('cap', b.cap, 'Escreva uma legenda', 'cap')}${bx}</div>`;
  if (b.t === 'audio') return `${head}<div class="media aud"><span class="aname">${GI.audio}<span>${esc(b.n || 'Áudio')}</span></span><audio ${url} controls preload="metadata"></audio>${broken}</div>${bx}</div>`;
  const ext = (b.n || '').split('.').pop().slice(0, 4) || 'arq';
  return `${head}<a class="fcard" ${href} target="_blank" rel="noopener"><span class="fext">${esc(ext)}</span><span class="mtxt"><b>${esc(b.n || 'Arquivo')}</b><small>${sizeFmt(b.s)} · Toque para abrir</small></span><span class="fopen">↗</span></a>${bx}</div>`;
}
function renderMath(el, src){

  if (!String(src || '').trim()) { el.textContent = 'Fórmula vazia. Toque para escrever.'; return; }
  if (window.katex) { try { el.innerHTML = window.katex.renderToString(src, { output: 'mathml', displayMode: true, throwOnError: false }); return; } catch {} }
  el.textContent = src;
}
function renderBlocks(){

  el.innerHTML = list.map(b => { n = b.t === 'ol' ? n + 1 : 0; return blockHTML(b, n); }).join('');
  el.querySelectorAll('.t-math').forEach(row => { const b = list[blockIndex(row.dataset.id)]; if (b) renderMath(row.querySelector('.mview'), b.x); });

/* arquivos: no claude.ai vêm de /_blob/; no app, de links temporários do Supabase */
function assetUrl(id){ if (!IS_APP) return '/_blob/' + id; const s = signed[id]; return s && s.exp > Date.now() ? s.url : ''; }
function srcA(attr, id){ const u = assetUrl(id); return (u ? `${attr}="${esc(u)}" ` : '') + `data-asset="${esc(id)}" data-attr="${attr}"`; }
async function hydrateAssets(root){
  if (!IS_APP || !SB) return;
  for (const el of root.querySelectorAll('[data-asset]')) {
    const id = el.dataset.asset; if (el.getAttribute(el.dataset.attr)) continue;
    let s = signed[id];
    if (!s || s.exp < Date.now()) {
      const { data } = await SB.storage.from('arquivos').createSignedUrl(id, 3600);
      if (!data) { el.closest('.media')?.classList.add('broken'); continue; }
      s = signed[id] = { url: data.signedUrl, exp: Date.now() + 3300e3 };
    }
    el.setAttribute(el.dataset.attr, s.url);
  }
}
const katexScript = document.createElement('script');

/* cursor */
function caretOff(el){
  const s = getSelection(); if (!s.rangeCount) return 0;
  const r = s.getRangeAt(0); if (!el.contains(r.startContainer)) return 0;
  const pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}
function setCaret(el, off){
  el.focus();
  const r = document.createRange(), w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n = 0, t, placed = false;
  while ((t = w.nextNode())) { if (n + t.length >= off) { r.setStart(t, off - n); placed = true; break; } n += t.length; }
  if (!placed) { r.selectNodeContents(el); r.collapse(false); } else r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusBlock(id, off){
  const b = blocksOf()[blockIndex(id)];
  if (b && b.t === 'math' && !mathEditing.has(id)) { mathEditing.add(id); renderBlocks(); }
  const tx = document.querySelector(`#blocks .b[data-id="${id}"] .tx`); if (tx) setCaret(tx, off ?? tx.textContent.length);
}
function textNeighbour(i, dir){ const l = blocksOf(); for (let j = i + dir; j >= 0 && j < l.length; j += dir) if (TEXTY.has(l[j].t) && l[j].t !== 'math') return l[j]; return null; }
function exitBlock(i){
  const l = blocksOf(), nx = l[i + 1];
  if (nx && TEXTY.has(nx.t) && nx.t !== 'math') { renderBlocks(); focusBlock(nx.id, 0); return; }
  const p = { id: nid(), t: 'p', x: '' }; l.splice(i + 1, 0, p); renderBlocks(); focusBlock(p.id, 0); saveNote();
}
function lineToBlock(line){
  line = line.replace(/\{data\}/g, todayShort());
  if (line.trim() === '---') return { id: nid(), t: 'divider', x: '' };
  for (const [re, t] of MD) { const m = line.match(re); if (m) return { id: nid(), t, x: line.slice(m[0].length) }; }
  return { id: nid(), t: 'p', x: line };
}

/* envio de arquivos */
function pickFile(b){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = MEDIA[b.t].accept; inp.hidden = true;
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) uploadFile(b.id, f); });
  document.body.appendChild(inp); inp.click();
}
async function toJpeg(file){
  let bmp; try { bmp = await createImageBitmap(file); } catch { throw { code: 'decode' }; }
  const s = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(x => x ? res(x) : rej({ code: 'decode' }), 'image/jpeg', 0.86));
}
async function uploadFile(id, file){
  const key = pageKey(), b = blocksOf()[blockIndex(id)]; if (!b) return;
  const redraw = () => { if (key === pageKey()) renderBlocks(); };
  if (!assetsNS) { upState[id] = { err: 'Para enviar arquivos, este acesso ao planner precisa ser de Editor.' }; redraw(); return; }
  let blob = file, type = (file.type || '').toLowerCase(), name = file.name || 'arquivo';
  const ext = (name.split('.').pop() || '').toLowerCase();
  try {
    if (b.t === 'image' || (b.t === 'file' && type.startsWith('image/'))) {
      if (!['image/png','image/jpeg','image/gif','image/webp'].includes(type) || file.size > 3e6) {
        blob = await toJpeg(file); type = 'image/jpeg';
        if (!/\.jpe?g$/i.test(name)) name = name.replace(/\.[^.]+$/, '') + '.jpg';
      }
    } else if (b.t === 'video' || (b.t === 'file' && type.startsWith('video/'))) {
      type = type === 'video/webm' ? 'video/webm' : 'video/mp4';
    } else if (b.t === 'audio') {
      type = /webm|ogg|opus/.test(type + ext) ? 'video/webm' : 'video/mp4';
    } else {
      const T = { pdf: 'application/pdf', txt: 'text/plain', csv: 'text/csv', md: 'text/markdown', json: 'application/json' };
      type = T[ext] || (type === 'application/pdf' ? type : '');
      if (!type || (b.t === 'pdf' && type !== 'application/pdf')) throw { code: 'unsupported_type' };
    }
    if (blob.size > 20 * 1048576) throw { code: 'too_large' };
    upState[id] = { busy: name }; redraw();
    const res = await assetsNS.upload(blob, { type });
    delete upState[id];
    const cur = (getDoc(key).f.blocks || []).find(x => x.id === id);
    if (cur) { Object.assign(cur, { a: res.id, n: name, s: res.sizeBytes, ct: res.contentType }); touch(key); }
    redraw();
  } catch (e) {
    upState[id] = { err: UPERR[e && e.code] || 'Não foi possível enviar. Tente de novo.' }; redraw();
  }
}
function saveBookmark(row, b){
  const v = (row.querySelector('[data-bm]').value || '').trim();
  let u;
  try { u = new URL(/^https?:\/\//i.test(v) ? v : 'https://' + v); if (!/^https?:$/.test(u.protocol) || !u.hostname.includes('.')) throw 0; }
  catch { upState[b.id] = { err: 'Esse link não parece válido. Confira e cole de novo.' }; renderBlocks(); row = document.querySelector(`#blocks .b[data-id="${b.id}"] [data-bm]`); if (row) { row.value = v; row.focus(); } return; }
  delete upState[b.id];
  b.url = u.href; b.title = b.title || u.hostname.replace(/^www\./, '');
  renderBlocks(); saveNote();
}

function wireEditor(ed){
  const title = document.getElementById('ntitle'), blocksEl = document.getElementById('blocks');
  title.addEventListener('input', () => {
    if (title.innerHTML === '<br>') title.innerHTML = '';
    const it = byId(S.noteId); if (!it) return;
    it.title = title.textContent.replace(/\n/g, ' '); saveTree(); renderTree();
  });
  title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const f = blocksOf().find(b => TEXTY.has(b.t) && b.t !== 'math'); if (f) focusBlock(f.id, 0); else exitBlock(-1); } });
  title.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s*\n\s*/g, ' ')); });

  blocksEl.addEventListener('input', e => {
    const kEl = e.target.closest('[data-k]');
    if (kEl) {
      const b = blockOf(kEl); if (!b) return;
      if (kEl.innerHTML === '<br>') kEl.innerHTML = '';
      const v = kEl.matches('input,textarea') ? kEl.value : kEl.textContent, k = kEl.dataset.k.split('.');
      if (k[0] === 'r') b.rows[+k[1]][+k[2]] = v;
      else if (k[0] === 'col') { const c = b.cols.find(x => x.id === k[1]); if (c) c.name = v; }
      else if (k[0] === 'card') { const c = b.cols.find(x => x.id === k[1]); const card = c && c.cards.find(x => x.id === k[2]); if (card) card.text = v; }
      else b[k[0]] = v;
      if (k[0] === 'label') { const s = kEl.closest('.b').querySelector('.tplbtn span'); if (s) s.textContent = v || 'Botão'; }
      saveNote(); return;
    }
    const tx = e.target.closest('.tx'); if (!tx) return;
    const b = blockOf(tx); if (!b) return;
    if (tx.innerHTML === '<br>') tx.innerHTML = '';
    b.x = tx.textContent;
    if (b.t === 'math') { renderMath(tx.closest('.b').querySelector('.mview'), b.x); saveNote(); return; }
    if (b.t === 'p' && !slash) {
      const plain = b.x.replace(/ /g, ' ');
      for (const [re, t] of MD) {
        const m = plain.match(re);
        if (m && caretOff(tx) === m[0].length) { b.t = t; b.x = b.x.slice(m[0].length); renderBlocks(); focusBlock(b.id, 0); saveNote(); return; }
      }
      if (plain === '---' || plain === '```') {
        const l = blocksOf();
        if (plain === '```') { b.t = 'code'; b.x = ''; renderBlocks(); focusBlock(b.id, 0); saveNote(); return; }
        const p = { id: nid(), t: 'p', x: '' };
        b.t = 'divider'; b.x = ''; l.splice(blockIndex(b.id) + 1, 0, p); renderBlocks(); focusBlock(p.id, 0); saveNote(); return;
      }
    }
    if (slash) updateSlash();

    saveNote();
  });

  blocksEl.addEventListener('keydown', e => {
    if (e.target.matches('[data-bm]') && e.key === 'Enter') { e.preventDefault(); const b = blockOf(e.target); if (b) saveBookmark(e.target.closest('.b'), b); return; }
    const tx = e.target.closest('.tx'); if (!tx || e.isComposing) return;
    if (slash && slash.el === tx) {
      const n = slash.list.length;
      if (e.key === 'ArrowDown' && n) { e.preventDefault(); slash.i = (slash.i + 1) % n; updateSlash(); return; }
      if (e.key === 'ArrowUp' && n) { e.preventDefault(); slash.i = (slash.i - 1 + n) % n; updateSlash(); return; }
      if ((e.key === 'Enter' || e.key === 'Tab') && n) { e.preventDefault(); applySlash(slash.list[slash.i]); return; }

      if (e.key === 'Enter') closePop();

    }

      b.x = text.slice(0, off);
      const nb = { id: nid(), t: listy ? b.t : 'p', x: text.slice(off) };

let slashGone = '';
function openSlash(tx, b){
  const off = caretOff(tx), m = tx.textContent.slice(0, off).match(/(^|\s)\/([^\s/]{0,20})$/);

function updateSlash(){
  const { el, start } = slash;
  if (!document.body.contains(el)) return closePop();
  const off = caretOff(el), t = el.textContent;
  if (off <= start || t[start] !== '/') return closePop();
  const raw = t.slice(start + 1, off), q = normS(raw.trim());

  const today = new Date();

    ? list.map((x, j) => (j === 0 || list[j - 1].gp !== x.gp ? `<div class="cap">${x.gp}</div>` : '') +
        `<button class="it${j === slash.i ? ' on' : ''}" data-j="${j}" tabindex="-1"><span class="gl g-${x.k}">${x.k === 'date' ? today.getDate() : x.g}</span><span><b>${x.n}</b><small>${x.d}</small></span></button>`).join('')

const NEW_BLOCK = {
  image: () => ({}), video: () => ({}), audio: () => ({}), file: () => ({}), pdf: () => ({}),
  bookmark: () => ({}), crumb: () => ({}),
  table: () => ({ rows: [['', '', ''], ['', '', ''], ['', '', '']] }),
  board: () => ({ cols: [{ id: nid(), name: 'A fazer', cards: [] }, { id: nid(), name: 'Fazendo', cards: [] }, { id: nid(), name: 'Feito', cards: [] }] }),
  button: () => ({ label: 'Nova sessão', tpl: '## Sessão de {data}\nTema:\nObservações:\n[] Próximos passos' })

function applySlash(x){
  const { el, start, id } = slash, l = blocksOf(), b = l[blockIndex(id)];
  const off = caretOff(el), t = el.textContent, before = t.slice(0, start), after = t.slice(off);
  closePop(); if (!b) return;

    const ds = todayLong(); b.x = before + ds + after; renderBlocks(); focusBlock(b.id, (before + ds).length); saveNote(); return;
  }

    if (x.k === 'toggle') b.o = true;
    if (x.k === 'math') mathEditing.add(b.id);

  }

  b.x = before + after;
  let i = blockIndex(id);
  const nb = x.k === 'divider' ? { id: nid(), t: 'divider', x: '' } : { id: nid(), t: x.k, ...(NEW_BLOCK[x.k] ? NEW_BLOCK[x.k]() : {}) };
  if (x.k === 'page') {
    const it = { id: nid(), type: 'note', parent: S.noteId, title: '' };
    items().push(it); saveTree(); nb.ref = it.id;
  }
  if (!b.x.trim() && b.t === 'p') l.splice(i, 1, nb); else l.splice(++i, 0, nb);
  i = blockIndex(nb.id);

  if (x.k === 'button') btnEditing.add(nb.id);

  const rowEl = document.querySelector(`#blocks .b[data-id="${nb.id}"]`);

function derived(){

    : !IS_APP ? 'Os lembretes tocam no app do celular.'
    : text ? 'Dá para marcar mais de um lembrete.' : 'Escreva o compromisso para o lembrete ter um título.';
  pop.dataset.kind = 'rem'; pop.dataset.field = field;
  pop.innerHTML = `<div class="rem">
    <div class="cap">${isTask ? 'Horário e lembretes' : 'Lembretes · ' + time}</div>
    ${text ? `<div class="rtext">${esc(text)}</div>` : ''}
    ${isTask ? `<div class="rtime"><label for="rtime">Horário</label><input type="time" id="rtime" value="${esc(time)}">${time ? '<button class="mini ghost" data-rclear>Sem horário</button>' : ''}</div>` : ''}
    <div class="rchips${isTask && !time ? ' off' : ''}">${OFFSETS.map(([m, l]) => `<button class="rchip" data-m="${m}" aria-pressed="${sel.includes(m)}">${l}</button>`).join('')}${custom.map(m => `<button class="rchip" data-m="${m}" aria-pressed="true">${offsetLabel(m)}</button>`).join('')}</div>
    <div class="rcustom${isTask && !time ? ' off' : ''}"><span>Outro:</span><input type="number" id="rnum" min="1" max="999" inputmode="numeric" placeholder="3" aria-label="Quantidade"><select id="runit" aria-label="Unidade"><option value="1">min antes</option><option value="60">horas antes</option><option value="1440" selected>dias antes</option></select><button class="mini" data-radd>Adicionar</button></div>
    <small class="rnote">${note}</small>
  </div>`;
  placePop(btn.getBoundingClientRect());
}
function refreshRemBtn(field){ const old = pageEl.querySelector(`[data-rem="${field}"]`); if (old) old.outerHTML = remButtonHTML(field); }
function reopenRem(field){ const b = pageEl.querySelector(`[data-rem="${field}"]`); if (b) openRem(b); }
function setRems(field, list){
  const key = pageKey(), f = getDoc(key).f;
  const clean = [...new Set(list)].filter(m => m >= 0).sort((a, b) => b - a);
  if (clean.length) f['r-' + field] = clean; else delete f['r-' + field];
  touch(key); refreshRemBtn(field);
  if (clean.length) askNotifPermission();
}
pageEl.addEventListener('click', e => {
  const b = e.target.closest('[data-rem]'); if (!b) return;
  if (!pop.hidden && pop.dataset.kind === 'rem' && pop.dataset.field === b.dataset.rem) closePop(); else openRem(b);
});
pop.addEventListener('click', e => {
  if (pop.dataset.kind !== 'rem') return;
  const field = pop.dataset.field, f = getDoc(pageKey()).f, cur = remsOf(f, field);
  const chip = e.target.closest('[data-m]');
  if (chip) {
    const m = +chip.dataset.m, on = chip.getAttribute('aria-pressed') !== 'true';
    chip.setAttribute('aria-pressed', String(on));
    setRems(field, on ? [...cur, m] : cur.filter(x => x !== m)); return;
  }
  if (e.target.closest('[data-radd]')) {
    const n = +document.getElementById('rnum').value, u = +document.getElementById('runit').value;
    if (n > 0) { setRems(field, [...cur, Math.round(n * u)]); reopenRem(field); }
    return;
  }
  if (e.target.closest('[data-rclear]')) { delete f[field + 'time']; touch(pageKey()); refreshRemBtn(field); reopenRem(field); }
});
pop.addEventListener('change', e => {
  if (pop.dataset.kind !== 'rem' || e.target.id !== 'rtime') return;
  const field = pop.dataset.field, f = getDoc(pageKey()).f;
  if (e.target.value) f[field + 'time'] = e.target.value; else delete f[field + 'time'];
  touch(pageKey()); refreshRemBtn(field); reopenRem(field);
});

/* ---------- lembretes: agendamento no Android ---------- */
function LN(){ return IS_APP && window.Capacitor.Plugins ? window.Capacitor.Plugins.LocalNotifications : null; }
function queueReminders(date){ if (!LN()) return; clearTimeout(remTimers[date]); remTimers[date] = setTimeout(() => scheduleDay(date), 1200); }
function notifId(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 1) || 1; }
function dayItems(f){
  const out = [];
  for (let h = 6; h <= 22; h++) {
    out.push({ field: 'h' + h, time: `${pad(h)}:00` });
    if (h < 22) out.push({ field: `h${h}m`, time: `${pad(h)}:30` });
  }
  for (let i = 1; i <= listN('t', f); i++) if (f[`t${i}time`] && !f[`t${i}c`]) out.push({ field: 't' + i, time: f[`t${i}time`] });
  return out.filter(it => (f[it.field] || '').trim() && remsOf(f, it.field).length);
}
const relText = m => m ? 'Daqui a ' + offsetLabel(m).replace(' antes', '') : 'Agora';
async function scheduleDay(date){
  const ln = LN(); if (!ln) return;
  const doc = cache['day-' + date] || ls.get('day-' + date), f = (doc && doc.f) || {};
  let old = []; try { old = JSON.parse(ls.pref('nt:' + date) || '[]'); } catch {}
  try { if (old.length) await ln.cancel({ notifications: old.map(id => ({ id })) }); } catch {}
  const [y, mo, d] = date.split('-').map(Number), now = Date.now(), list = [];
  for (const it of dayItems(f)) {
    const [hh, mm] = it.time.split(':').map(Number), when = new Date(y, mo - 1, d, hh, mm);
    for (const m of remsOf(f, it.field)) {
      const at = new Date(when.getTime() - m * 60000);
      if (at.getTime() <= now + 3000) continue;
      list.push({
        id: notifId(`${date}|${it.field}|${m}`), title: f[it.field].trim(),
        body: `${relText(m)} · ${DIAS[when.getDay()].replace('-feira', '')}, ${d}/${pad(mo)} às ${it.time}`,
        schedule: { at, allowWhileIdle: true }, extra: { date }
      });
    }
  }
  try { if (list.length) await ln.schedule({ notifications: list }); } catch {}
  ls.pref('nt:' + date, JSON.stringify(list.map(n => n.id)));
}
function rescheduleAll(){
  for (let i = 0; i <= 60; i++) {
    const d = iso(addDays(new Date(), i)), doc = cache['day-' + d] || ls.get('day-' + d);
    if (doc && Object.keys(doc.f || {}).some(k => k.startsWith('r-'))) scheduleDay(d);
  }
}
let askedNotif = false;
async function askNotifPermission(){
  const ln = LN(); if (!ln || askedNotif) return; askedNotif = true;
  try { const p = await ln.checkPermissions(); if (p.display !== 'granted') await ln.requestPermissions(); } catch {}
}

/* ---------- modo aplicativo: login, Supabase e atualizações ---------- */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function supaDb(sb, uid){
  const fail = e => { throw { code: e && (e.code === '42501' || e.code === 'PGRST301') ? 'invalid_argument' : 'unavailable' }; };
  return { doc(path){
    const key = path.replace(/^planner\//, '');
    return {
      async get(){ const { data, error } = await sb.from('planner_docs').select('data').eq('key', key).maybeSingle(); if (error) fail(error); return { exists: !!data, data: () => data && data.data }; },
      async set(d){ const { error } = await sb.from('planner_docs').upsert({ user_id: uid, key, data: d, updated_at: new Date().toISOString() }, { onConflict: 'user_id,key' }); if (error) fail(error); },
      async delete(){ const { error } = await sb.from('planner_docs').delete().eq('key', key); if (error) fail(error); }
    };
  } };
}
function supaAssets(sb, uid){
  return {
    async upload(blob, { type }){
      const path = `${uid}/${nid()}${nid()}`;
      const { error } = await sb.storage.from('arquivos').upload(path, blob, { contentType: type, upsert: false });
      if (error) throw { code: /size|large|exceed/i.test(error.message || '') ? 'too_large' : 'upstream_error' };
      return { id: path, url: '', sizeBytes: blob.size, contentType: type };
    },
    async delete(id){ await sb.storage.from('arquivos').remove([id]); return { deleted: true }; }
  };
}
function loginScreen(sb){
  return new Promise(resolve => {
    const box = document.createElement('div'); box.className = 'login';
    box.innerHTML = `<form class="lcard" id="lform">
      <div class="seal" aria-hidden="true"><span>R</span><span>B</span></div>
      <h1>Planner da <em>Raísa</em></h1>
      <p>Entre para seus dados ficarem guardados e iguais em todos os aparelhos.</p>
      <label for="lmail">E-mail</label><input id="lmail" type="email" autocomplete="email" required>
      <label for="lpass">Senha</label><input id="lpass" type="password" autocomplete="current-password" minlength="6" required>
      <p class="lmsg" id="lmsg" role="status"></p>
      <div class="sidebtns"><button class="mini solid" type="submit">Entrar</button><button class="mini" type="button" id="lnew">Criar conta</button></div>
    </form>`;
    document.body.appendChild(box);
    const msg = t => { box.querySelector('#lmsg').textContent = t; };
    const creds = () => ({ email: box.querySelector('#lmail').value.trim(), password: box.querySelector('#lpass').value });
    const done = s => { box.remove(); resolve(s); };
    box.querySelector('#lform').addEventListener('submit', async e => {
      e.preventDefault(); msg('Entrando…');
      const { data, error } = await sb.auth.signInWithPassword(creds());
      if (error) return msg(/confirm/i.test(error.message) ? 'Confirme seu e-mail pelo link que enviamos e toque em Entrar de novo.' : /fetch|network/i.test(error.message) ? 'Sem internet. Conecte e tente de novo.' : 'E-mail ou senha não conferem.');
      done(data.session);
    });
    box.querySelector('#lnew').addEventListener('click', async () => {
      const c = creds();
      if (!c.email || c.password.length < 6) return msg('Preencha o e-mail e uma senha com pelo menos 6 caracteres.');
      msg('Criando conta…');
      const { data, error } = await sb.auth.signUp(c);
      if (error) return msg('Não foi possível criar a conta: ' + error.message);
      if (data.session) return done(data.session);
      msg('Conta criada. Abra o e-mail de confirmação e depois toque em Entrar.');
    });
  });
}
async function syncUpcoming(sb){
  const from = 'day-' + iso(new Date()), to = 'day-' + iso(addDays(new Date(), 60));
  try {
    const { data } = await sb.from('planner_docs').select('key,data').gte('key', from).lte('key', to);
    (data || []).forEach(r => { if (!dirty.has(r.key)) { cache[r.key] = norm(r.data); ls.set(r.key, cache[r.key]); } });
  } catch {}
  rescheduleAll();
}
/* cada APK novo é publicado pelo GitHub na pasta pública "atualizacoes" do Supabase, junto com latest.json */
async function checkUpdate(cfg){
  if (!cfg.supabaseUrl || !cfg.build) return;
  try {
    const base = cfg.supabaseUrl.replace(/\/$/, '') + '/storage/v1/object/public/atualizacoes/';
    const j = await (await fetch(base + 'latest.json?t=' + Date.now(), { cache: 'no-store' })).json();
    const apk = j.apk && { browser_download_url: base + encodeURIComponent(j.apk) };
    if (!(+j.build > cfg.build && apk)) return;
    const bar = document.createElement('div'); bar.className = 'upd'; bar.setAttribute('role', 'status');
    bar.innerHTML = '<span>Nova versão do planner disponível</span><button class="mini solid">Atualizar</button><button class="mini ghost">Agora não</button>';
    document.body.appendChild(bar);
    const [now, later] = bar.querySelectorAll('button');
    now.addEventListener('click', () => { const B = window.Capacitor.Plugins.Browser; if (B) B.open({ url: apk.browser_download_url }); else location.href = apk.browser_download_url; });
    later.addEventListener('click', () => bar.remove());
  } catch {}
}
if (IS_APP) (async () => {
  const P = window.Capacitor.Plugins;
  document.documentElement.classList.add('app');
  let cfg = {}; try { cfg = await (await fetch('build.json', { cache: 'no-store' })).json(); } catch {}
  checkUpdate(cfg);
  if (P.App) {
    P.App.addListener('backButton', () => { if (!pop.hidden) closePop(); else if (S.view !== 'dia') go('dia'); else P.App.exitApp(); });
    P.App.addListener('resume', () => pull(pageKey()));
  }
  if (LN()) LN().addListener('localNotificationActionPerformed', a => {
    const d = a.notification && a.notification.extra && a.notification.extra.date; if (!d) return;
    const [y, m, dd] = d.split('-').map(Number); S.date = new Date(y, m - 1, dd); go('dia');
  });
  if (!cfg.supabaseUrl || !cfg.supabaseKey) { setStatus('warn', 'Salvo só neste aparelho'); rescheduleAll(); return; }
  try { await loadScript('vendor/supabase.js'); } catch { setStatus('warn', 'Salvo só neste aparelho'); rescheduleAll(); return; }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  let session = (await sb.auth.getSession()).data.session;
  if (!session) session = await loginScreen(sb);
  const uid = session.user.id;
  SB = sb; db = supaDb(sb, uid); assetsNS = supaAssets(sb, uid);
  setStatus();
  pull('config'); pull('notes-tree'); pull(pageKey());
  syncUpcoming(sb);
})();

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    window.claude.use('assets').then(a => { assetsNS = a; }, () => {});
    const d = await window.claude.use('db'); if (!d) return;
    const u = await window.claude.use('user');
    const can = u && u.can ? await u.can('data.write') : null;
    if (can === false) return;           // quem só visualiza guarda tudo no próprio aparelho
    db = d; setStatus();
    pull('config'); pull('notes-tree'); pull(pageKey());
  } catch {}
})();
})();
</script>
