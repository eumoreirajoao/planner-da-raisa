name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar a pasta do app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: bash scripts/prepare-www.sh

      - name: Criar o projeto Android
        run: |
          npx cap add android
          bash scripts/patch-android.sh

      - name: Ícone e tela de abertura
        continue-on-error: true
        run: |
          sudo apt-get install -y librsvg2-bin > /dev/null
          bash scripts/icons.sh
          npx --yes @capacitor/assets@3.0.5 generate --android --assetPath assets/build

      - name: Copiar a página para o projeto
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Assinar
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > ks.p12
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASS --out planner-da-raisa.apk aligned.apk
          rm ks.p12
          "$BT/apksigner" verify planner-da-raisa.apk

      - name: Guardar o APK nesta montagem
        uses: actions/upload-artifact@v4
        with:
          name: planner-da-raisa-${{ env.VERSION }}
          path: planner-da-raisa.apk

      - name: Publicar a atualização no Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          BASE="${SUPABASE_URL%/}/storage/v1/object"
          NEW="planner-da-raisa-$VERSION.apk"
          OLD=$(curl -sf "$BASE/public/atualizacoes/latest.json?t=$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("apk",""))' || true)
          curl -sf -X POST "$BASE/atualizacoes/$NEW" \
            -H "Authorization: Bearer $SERVICE_KEY" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @planner-da-raisa.apk > /dev/null
          printf '{"build":%s,"version":"%s","apk":"%s"}' "$BUILD" "$VERSION" "$NEW" > latest.json
          curl -sf -X POST "$BASE/atualizacoes/latest.json" \
            -H "Authorization: Bearer $SERVICE_KEY" -H "x-upsert: true" -H "cache-control: no-cache" \
            -H "Content-Type: application/json" --data-binary @latest.json > /dev/null
          if [ -n "$OLD" ] && [ "$OLD" != "$NEW" ]; then
            curl -sf -X DELETE "$BASE/atualizacoes/$OLD" -H "Authorization: Bearer $SERVICE_KEY" > /dev/null || true
          fi
          echo "Link para instalar: $BASE/public/atualizacoes/$NEW" >> "$GITHUB_STEP_SUMMARY"
